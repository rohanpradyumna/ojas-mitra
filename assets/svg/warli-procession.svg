  <!-- ═════════════════════════════════
       LEFT FRAMING TREE  (x=80)
  ═════════════════════════════════ -->
  <!-- Lower wider triangle: apex (80,40), base (42,100)–(118,100) -->
  <path d="M 80,40 L 44,100 L 116,100 Z"
        fill="none" stroke="#a8472a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Upper narrow triangle: apex (80,10), base y=40 -->
  <path d="M 80,10 L 64,40 L 96,40 Z"
        fill="none" stroke="#a8472a" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="80" cy="10" r="3" fill="#a8472a"/>
  <circle cx="64" cy="40" r="2.5" fill="#a8472a"/>
  <circle cx="96" cy="40" r="2.5" fill="#a8472a"/>

  <!-- ═════════════════════════════════
       LEFT PROCESSION  — 3 women + child
       Waists at y=80.
  ═════════════════════════════════ -->

  <!-- P1 · pot on head · x=178 -->
  <g transform="translate(178,80)">
    <!-- pot above head -->
    <ellipse cx="0" cy="-45" rx="10" ry="5" fill="#a8472a"/>
    <line x1="0" y1="-40" x2="0" y2="-33" stroke="#a8472a" stroke-width="1.2"/>
    <!-- head -->
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <!-- TORSO: solid triangle, apex DOWN at waist (0,0) -->
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <!-- PELVIS: solid triangle, apex UP at waist (0,0) -->
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <!-- arms raised to hold pot -->
    <line x1="-9" y1="-14" x2="-9" y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="9"  y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- walking legs -->
    <line x1="-8" y1="12" x2="-12" y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12" x2="4"   y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- P2 · walking · x=228 -->
  <g transform="translate(228,80)">
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <line x1="-9" y1="-14" x2="-22" y2="-6"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="20"  y2="-4"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-13" y2="20"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="3"   y2="20"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- P3 · pot on head · x=278 -->
  <g transform="translate(278,80)">
    <ellipse cx="0" cy="-45" rx="10" ry="5" fill="#a8472a"/>
    <line x1="0" y1="-40" x2="0" y2="-33" stroke="#a8472a" stroke-width="1.2"/>
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <line x1="-9" y1="-14" x2="-9" y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="9"  y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-12" y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="4"   y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Child · smaller scale · waist at y=88 · x=323 -->
  <g transform="translate(323,88)">
    <circle cx="0" cy="-18" r="4.5" fill="#a8472a"/>
    <path d="M -6,-11 L 6,-11 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -5,8 L 5,8 Z" fill="#a8472a"/>
    <line x1="-6" y1="-11" x2="-14" y2="-5" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6"  y1="-11" x2="14"  y2="-5" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-5" y1="8"   x2="-7"  y2="14" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="5"  y1="8"   x2="7"   y2="14" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ═════════════════════════════════
       HUT  (centre, x=400)
  ═════════════════════════════════ -->
  <g transform="translate(400,100)">
    <rect x="-28" y="-60" width="56" height="60" fill="none" stroke="#a8472a" stroke-width="1.3"/>
    <path d="M -34,-60 L 0,-100 L 34,-60 Z" fill="none" stroke="#a8472a" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- door -->
    <rect x="-10" y="-28" width="20" height="28" fill="#a8472a"/>
    <!-- window -->
    <rect x="-24" y="-52" width="12" height="12" fill="none" stroke="#a8472a" stroke-width="0.9"/>
    <rect x="12"  y="-52" width="12" height="12" fill="none" stroke="#a8472a" stroke-width="0.9"/>
    <!-- smoke line from apex -->
    <line x1="0" y1="-100" x2="0" y2="-116" stroke="#a8472a" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="0" cy="-118" r="2.5" fill="#a8472a"/>
  </g>

  <!-- ═════════════════════════════════
       TARPA PLAYER  (x=460, waist y=80)
       Central figure with curved horn
  ═════════════════════════════════ -->
  <g transform="translate(460,80)">
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <!-- right arm raised, holding tarpa horn -->
    <line x1="9" y1="-14" x2="26" y2="-34" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- tarpa: curved tube with flared bell -->
    <path d="M 26,-34 Q 42,-24 38,-8 Q 36,-1 48,4"
          fill="none" stroke="#a8472a" stroke-width="1.4" stroke-linecap="round"/>
    <!-- bell flare -->
    <path d="M 44,2 L 52,7 L 45,13 Z" fill="#a8472a"/>
    <!-- left arm out -->
    <line x1="-9" y1="-14" x2="-23" y2="-6" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-12" y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="12"  y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ═════════════════════════════════
       RIGHT PROCESSION  (mirrored)
  ═════════════════════════════════ -->

  <!-- R1 · pot · x=530 (mirrored) -->
  <g transform="translate(530,80) scale(-1,1)">
    <ellipse cx="0" cy="-45" rx="10" ry="5" fill="#a8472a"/>
    <line x1="0" y1="-40" x2="0" y2="-33" stroke="#a8472a" stroke-width="1.2"/>
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <line x1="-9" y1="-14" x2="-9" y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="9"  y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-12" y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="4"   y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- R2 · walking · x=580 (mirrored) -->
  <g transform="translate(580,80) scale(-1,1)">
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <line x1="-9" y1="-14" x2="-22" y2="-6"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="20"  y2="-4"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-13" y2="20"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="3"   y2="20"  stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- R3 · pot · x=630 (mirrored) -->
  <g transform="translate(630,80) scale(-1,1)">
    <ellipse cx="0" cy="-45" rx="10" ry="5" fill="#a8472a"/>
    <line x1="0" y1="-40" x2="0" y2="-33" stroke="#a8472a" stroke-width="1.2"/>
    <circle cx="0" cy="-27" r="6.5" fill="#a8472a"/>
    <path d="M -9,-14 L 9,-14 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -8,12 L 8,12 Z" fill="#a8472a"/>
    <line x1="-9" y1="-14" x2="-9" y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9"  y1="-14" x2="9"  y2="-40" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="12"  x2="-12" y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="12"  x2="4"   y2="20" stroke="#a8472a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ═════════════════════════════════
       SUN  (x=680, y=25)
  ═════════════════════════════════ -->
  <circle cx="680" cy="25" r="18" fill="none" stroke="#a8472a" stroke-width="1.4"/>
  <line x1="680" y1="4"  x2="680" y2="-2" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="680" y1="46" x2="680" y2="52" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="659" y1="25" x2="653" y2="25" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="701" y1="25" x2="707" y2="25" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="665" y1="11" x2="661" y2="7"  stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="695" y1="11" x2="699" y2="7"  stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="665" y1="39" x2="661" y2="43" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="695" y1="39" x2="699" y2="43" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="680" cy="25" r="7" fill="none" stroke="#a8472a" stroke-width="0.6" opacity="0.5"/>

  <!-- ═════════════════════════════════
       RIGHT FRAMING TREE  (x=730)
  ═════════════════════════════════ -->
  <path d="M 730,40 L 694,100 L 766,100 Z"
        fill="none" stroke="#a8472a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 730,10 L 714,40 L 746,40 Z"
        fill="none" stroke="#a8472a" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="730" cy="10" r="3" fill="#a8472a"/>
  <circle cx="714" cy="40" r="2.5" fill="#a8472a"/>
  <circle cx="746" cy="40" r="2.5" fill="#a8472a"/>

  <!-- ═════════════════════════════════
       V-WING BIRDS (sky)
  ═════════════════════════════════ -->
  <path d="M 150,18 Q 155,13 160,18" fill="none" stroke="#a8472a" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M 350,10 Q 355,5  360,10" fill="none" stroke="#a8472a" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M 550,14 Q 555,9  560,14" fill="none" stroke="#a8472a" stroke-width="1.0" stroke-linecap="round"/>

</svg>
