<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none">
  <!--
    AUTHENTIC WARLI PROCESSION — 800×120
    ======================================
    Scene: left framing tree → 3 women with pots + 1 child → house → tarpa player
            → right procession → right framing tree.
    Human figures = TWO SOLID TRIANGLES (hourglass body), NOT stick figures.
    Ground at y=100. Figure waists at y=80.
    Geometry: torso M-9,-14 L9,-14 L0,0 Z  |  pelvis M0,0 L-8,12 L8,12 Z
              head r=6.5 at cy=-20.  Feet at y=100 (80+12+8 = 100).
    Trees = stacked conical triangles.
    Fish border at y=108. Zigzag at y=103.
  -->

  <!-- ═════════════════════════════════
       GROUND + BORDERS
  ═════════════════════════════════ -->
  <line x1="40" y1="100" x2="760" y2="100" stroke="#a8472a" stroke-width="0.8" opacity="0.7"/>

  <!-- Zigzag border strip (y=100–107) -->
  <polyline
    points="40,100 46,106 52,100 58,106 64,100 70,106 76,100 82,106 88,100 94,106 100,100
            106,106 112,100 118,106 124,100 130,106 136,100 142,106 148,100 154,106 160,100
            166,106 172,100 178,106 184,100 190,106 196,100 202,106 208,100 214,106 220,100
            226,106 232,100 238,106 244,100 250,106 256,100 262,106 268,100 274,106 280,100
            286,106 292,100 298,106 304,100 310,106 316,100 322,106 328,100 334,106 340,100
            346,106 352,100 358,106 364,100 370,106 376,100 382,106 388,100 394,106 400,100
            406,106 412,100 418,106 424,100 430,106 436,100 442,106 448,100 454,106 460,100
            466,106 472,100 478,106 484,100 490,106 496,100 502,106 508,100 514,106 520,100
            526,106 532,100 538,106 544,100 550,106 556,100 562,106 568,100 574,106 580,100
            586,106 592,100 598,106 604,100 610,106 616,100 622,106 628,100 634,106 640,100
            646,106 652,100 658,106 664,100 670,106 676,100 682,106 688,100 694,106 700,100
            706,106 712,100 718,106 724,100 730,106 736,100 742,106 748,100 754,106 760,100"
    stroke="#a8472a" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Fish border (y=112, every 22px) -->
  <g stroke="#a8472a" fill="#a8472a" opacity="0.8">
    <!-- 34 fish from x=50 -->
    <ellipse cx="56"  cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 62,112 L 67,108 L 67,116 Z"/>
    <ellipse cx="78"  cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 84,112 L 89,108 L 89,116 Z"/>
    <ellipse cx="100" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 106,112 L 111,108 L 111,116 Z"/>
    <ellipse cx="122" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 128,112 L 133,108 L 133,116 Z"/>
    <ellipse cx="144" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 150,112 L 155,108 L 155,116 Z"/>
    <ellipse cx="166" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 172,112 L 177,108 L 177,116 Z"/>
    <ellipse cx="188" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 194,112 L 199,108 L 199,116 Z"/>
    <ellipse cx="210" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 216,112 L 221,108 L 221,116 Z"/>
    <ellipse cx="232" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 238,112 L 243,108 L 243,116 Z"/>
    <ellipse cx="254" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 260,112 L 265,108 L 265,116 Z"/>
    <ellipse cx="276" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 282,112 L 287,108 L 287,116 Z"/>
    <ellipse cx="298" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 304,112 L 309,108 L 309,116 Z"/>
    <ellipse cx="320" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 326,112 L 331,108 L 331,116 Z"/>
    <ellipse cx="342" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 348,112 L 353,108 L 353,116 Z"/>
    <ellipse cx="364" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 370,112 L 375,108 L 375,116 Z"/>
    <ellipse cx="386" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 392,112 L 397,108 L 397,116 Z"/>
    <ellipse cx="408" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 414,112 L 419,108 L 419,116 Z"/>
    <ellipse cx="430" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 436,112 L 441,108 L 441,116 Z"/>
    <ellipse cx="452" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 458,112 L 463,108 L 463,116 Z"/>
    <ellipse cx="474" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 480,112 L 485,108 L 485,116 Z"/>
    <ellipse cx="496" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 502,112 L 507,108 L 507,116 Z"/>
    <ellipse cx="518" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 524,112 L 529,108 L 529,116 Z"/>
    <ellipse cx="540" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 546,112 L 551,108 L 551,116 Z"/>
    <ellipse cx="562" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 568,112 L 573,108 L 573,116 Z"/>
    <ellipse cx="584" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 590,112 L 595,108 L 595,116 Z"/>
    <ellipse cx="606" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 612,112 L 617,108 L 617,116 Z"/>
    <ellipse cx="628" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 634,112 L 639,108 L 639,116 Z"/>
    <ellipse cx="650" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 656,112 L 661,108 L 661,116 Z"/>
    <ellipse cx="672" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 678,112 L 683,108 L 683,116 Z"/>
    <ellipse cx="694" cy="112" rx="6" ry="3" fill="none" stroke-width="0.7"/><path d="M 700,112 L 705,108 L 705,116 Z"/>
