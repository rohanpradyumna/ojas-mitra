<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 440" fill="none">
  <!--
    Handwash — soft sage green (aloe + tulsi)
    Distinctive colour: #9ed4a0 → #6ab870 → #3a8848
  -->
  <defs>
    <linearGradient id="fillHandwash" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0"   stop-color="#a4d8a8"/>
      <stop offset="0.5" stop-color="#70bc78"/>
      <stop offset="1"   stop-color="#3c9050"/>
    </linearGradient>
  </defs>

  <!-- Pump dispenser cap -->
  <rect x="80" y="20" width="40" height="38" rx="3" fill="#2a3a28"/>
  <!-- pump arm -->
  <path d="M 100 22 L 100 6 L 132 6 L 132 16 L 116 16 L 116 22 Z" fill="#344838"/>

  <!-- Bottle body -->
  <path d="
    M 88 58
    L 88 86
    L 60 110
    L 48 140
    L 48 380
    Q 48 410 78 410
    L 122 410
    Q 152 410 152 380
    L 152 140
    L 140 110
    L 112 86
    L 112 58
    Z
  " fill="url(#fillHandwash)" stroke="#307040" stroke-width="1.2"/>

  <!-- Highlight -->
  <line x1="66" y1="130" x2="66" y2="370" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="56" y="200" width="88" height="170" rx="2" fill="#f3ebd9" stroke="#a8472a" stroke-width="0.6"/>
  <line x1="68" y1="226" x2="132" y2="226" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="244" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="9" fill="#6b5141" font-style="italic" letter-spacing="0.5">
    Ojas Mithra
  </text>
  <text x="100" y="260" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="21" font-weight="500" fill="#2a1d14">
    Hand
  </text>
  <text x="100" y="282" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="21" font-weight="500" fill="#2a1d14">
    wash
  </text>
  <line x1="76" y1="300" x2="124" y2="300" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="314" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="6" fill="#a8472a" letter-spacing="2">
    ALOE · TULSI
  </text>

  <!-- Tiny Warli leaf ornament -->
  <path d="M 88,338 Q 100,328 112,338 Q 100,348 88,338 Z" fill="none" stroke="#a8472a" stroke-width="0.7"/>
</svg>
