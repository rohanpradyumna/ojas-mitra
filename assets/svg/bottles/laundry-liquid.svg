<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 440" fill="none">
  <!--
    Laundry Liquid — soft indigo blue (low foam, colours safe)
    Distinctive colour: #9ab4e0 → #6088c8 → #305898
  -->
  <defs>
    <linearGradient id="fillLaundry" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0"   stop-color="#a0b8e8"/>
      <stop offset="0.5" stop-color="#6088c8"/>
      <stop offset="1"   stop-color="#305898"/>
    </linearGradient>
  </defs>

  <!-- Cap + handle suggestion -->
  <rect x="80" y="20" width="40" height="38" rx="3" fill="#1a1e3a"/>
  <path d="M 100 22 L 100 6 L 132 6 L 132 16 L 116 16 L 116 22 Z" fill="#242840"/>
  <!-- side handle indicator -->
  <path d="M 150 180 Q 168 200 150 220" fill="none" stroke="#1a1e3a" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottle body (slightly wider base for jug feel) -->
  <path d="
    M 88 58
    L 88 86
    L 58 110
    L 44 140
    L 44 380
    Q 44 412 76 412
    L 124 412
    Q 156 412 156 380
    L 156 140
    L 142 110
    L 112 86
    L 112 58
    Z
  " fill="url(#fillLaundry)" stroke="#284878" stroke-width="1.2"/>

  <line x1="64" y1="130" x2="64" y2="370" stroke="rgba(255,255,255,0.20)" stroke-width="4" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="54" y="200" width="92" height="170" rx="2" fill="#f3ebd9" stroke="#a8472a" stroke-width="0.6"/>
  <line x1="66" y1="226" x2="134" y2="226" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="244" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="9" fill="#6b5141" font-style="italic" letter-spacing="0.5">
    Ojas Mithra
  </text>
  <text x="100" y="260" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="18" font-weight="500" fill="#2a1d14">
    Laundry
  </text>
  <text x="100" y="280" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="18" font-weight="500" fill="#2a1d14">
    liquid
  </text>
  <line x1="74" y1="300" x2="126" y2="300" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="314" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="6" fill="#a8472a" letter-spacing="2">
    LOW·FOAM
  </text>

  <!-- Warli wave ornament (flowing water / fabric) -->
  <path d="M 78,338 Q 84,333 90,338 Q 96,343 102,338 Q 108,333 114,338 Q 118,343 122,338"
        fill="none" stroke="#a8472a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M 82,346 Q 88,341 94,346 Q 100,351 106,346 Q 112,341 118,346"
        fill="none" stroke="#a8472a" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
</svg>
