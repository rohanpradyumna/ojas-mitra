<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 440" fill="none">
  <!--
    Vegetables & Fruits wash — fresh mint/pale green (soak & rinse)
    Distinctive colour: #b8e4c0 → #88ccaa → #4a9878
  -->
  <defs>
    <linearGradient id="fillVeg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0"   stop-color="#c0e8c8"/>
      <stop offset="0.5" stop-color="#88cca8"/>
      <stop offset="1"   stop-color="#4a9878"/>
    </linearGradient>
  </defs>

  <!-- Wide-mouth cap (soak bottle) -->
  <rect x="74" y="18" width="52" height="42" rx="4" fill="#1e3028"/>
  <rect x="84" y="10" width="32" height="12" rx="3" fill="#2a3a30"/>

  <!-- Bottle body — same silhouette -->
  <path d="
    M 88 60
    L 88 86
    L 60 110
    L 48 140
    L 48 380
    Q 48 410 78 410
    L 122 410
    Q 152 410 152 380
    L 152 140
    L 140 110
    L 112 86
    L 112 60
    Z
  " fill="url(#fillVeg)" stroke="#2a7858" stroke-width="1.2"/>

  <line x1="66" y1="130" x2="66" y2="370" stroke="rgba(255,255,255,0.20)" stroke-width="4" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="56" y="195" width="88" height="178" rx="2" fill="#f3ebd9" stroke="#a8472a" stroke-width="0.6"/>
  <line x1="68" y1="222" x2="132" y2="222" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="240" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="9" fill="#6b5141" font-style="italic" letter-spacing="0.5">
    Ojas Mithra
  </text>
  <text x="100" y="258" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="15" font-weight="500" fill="#2a1d14">
    Vegetables
  </text>
  <text x="100" y="276" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="15" font-weight="500" fill="#2a1d14">
    &amp; fruits
  </text>
  <line x1="76" y1="296" x2="124" y2="296" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="310" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="6" fill="#a8472a" letter-spacing="2">
    SOAK · RINSE
  </text>

  <!-- Warli conical tree ornament (for harvest) -->
  <path d="M 100,328 L 91,342 L 109,342 Z" fill="none" stroke="#a8472a" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M 100,322 L 94,332 L 106,332 Z" fill="none" stroke="#a8472a" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="100" cy="320" r="1.5" fill="#a8472a"/>
  <!-- dots (fruit) at triangle corners -->
  <circle cx="91" cy="342" r="1.2" fill="#a8472a"/>
  <circle cx="109" cy="342" r="1.2" fill="#a8472a"/>
</svg>
