<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 440" fill="none">
  <!--
    Dishwash — warm citrus amber (lemon + bio-enzyme)
    Distinctive colour: #f0cc50 → #d4a830 → #a87820
  -->
  <defs>
    <linearGradient id="fillDishwash" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0"   stop-color="#f2d458"/>
      <stop offset="0.5" stop-color="#d8b030"/>
      <stop offset="1"   stop-color="#a87c18"/>
    </linearGradient>
  </defs>

  <!-- Cap + nozzle -->
  <rect x="80" y="20" width="40" height="38" rx="3" fill="#3a261b"/>
  <path d="M 100 22 L 100 6 L 132 6 L 132 16 L 116 16 L 116 22 Z" fill="#4a3025"/>

  <!-- Bottle body — shouldered, tapered -->
  <path d="
    M 88 58
    L 88 86
    L 60 110
    L 48 140
    L 48 380
    Q 48 410 78 410
    L 122 410
    Q 152 410 152 380
    L 152 140
    L 140 110
    L 112 86
    L 112 58
    Z
  " fill="url(#fillDishwash)" stroke="#8a6010" stroke-width="1.2"/>

  <!-- Highlight line — gives the bottle glass-like depth -->
  <line x1="66" y1="130" x2="66" y2="370" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="56" y="200" width="88" height="170" rx="2" fill="#f3ebd9" stroke="#a8472a" stroke-width="0.6"/>
  <line x1="68" y1="226" x2="132" y2="226" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="244" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="9" fill="#6b5141" font-style="italic" letter-spacing="0.5">
    Ojas Mithra
  </text>
  <text x="100" y="264" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="21" font-weight="500" fill="#2a1d14">
    Dishwash
  </text>
  <line x1="76" y1="292" x2="124" y2="292" stroke="#a8472a" stroke-width="0.5"/>
  <text x="100" y="306" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="6" fill="#a8472a" letter-spacing="2">
    BIO·ENZYME
  </text>

  <!-- Tiny Warli fish ornament on label -->
  <ellipse cx="100" cy="332" rx="7" ry="3.5" fill="none" stroke="#a8472a" stroke-width="0.6"/>
  <path d="M 107,332 L 112,328 L 112,336 Z" fill="#a8472a"/>
  <circle cx="95" cy="331" r="1" fill="#a8472a"/>
</svg>
