<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    AUTHENTIC WARLI TARPA DANCE CIRCLE — 200×200
    =============================================
    8 dancers arranged at r=58 from center (100,100)
    + central tarpa player holding a curved horn.
    Each dancer = two solid TRIANGLES (hourglass body), NOT stick figures.
    Upper triangle = torso (apex DOWN at waist).
    Lower triangle = pelvis (apex UP at waist).
    Arms from shoulder corners of torso.
    Legs from hip corners of pelvis.
    All in #a8472a (terracotta).
  -->

  <!-- Dashed ring guide (the circle where dancers hold hands) -->
  <circle cx="100" cy="100" r="58" stroke="#a8472a" stroke-width="0.5"
          stroke-dasharray="3 5" opacity="0.35"/>

  <!-- ── Figure geometry at any waist position (tx,ty):
       translate(tx,ty)
       head:   circle cy=-22 r=5
       torso:  M-8,-16 L8,-16 L0,0 Z
       pelvis: M0,0 L-7,14 L7,14 Z
       arms:   from (±8,-16) → outward-raised
       legs:   from (±7,14) → to y+12
  ── -->

  <!-- ══ CENTRAL TARPA PLAYER ══ -->
  <g transform="translate(100,100)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <!-- right arm raised, holding tarpa horn -->
    <line x1="8" y1="-16" x2="22" y2="-32" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <!-- tarpa horn: curved tube with flared bell -->
    <path d="M 22,-32 Q 34,-24 31,-10 Q 30,-4 39,0"
          fill="none" stroke="#a8472a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- bell -->
    <path d="M 35,-2 L 43,3 L 37,8 Z" fill="#a8472a"/>
    <!-- left arm out -->
    <line x1="-8" y1="-16" x2="-20" y2="-8" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14" x2="-11" y2="26" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14" x2="11"  y2="26" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 1 · 0° top · waist (100, 42) ══ -->
  <g transform="translate(100,42)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <!-- arms: both raised outward in dance -->
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 2 · 45° top-right · waist (141, 59) ══ -->
  <g transform="translate(141,59)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 3 · 90° right · waist (158, 100) ══ -->
  <g transform="translate(158,100)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 4 · 135° bottom-right · waist (141, 141) ══ -->
  <g transform="translate(141,141)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 5 · 180° bottom · waist (100, 158) ══ -->
  <g transform="translate(100,158)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 6 · 225° bottom-left · waist (59, 141) ══ -->
  <g transform="translate(59,141)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="24"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 7 · 270° left · waist (42, 100) ══ -->
  <g transform="translate(42,100)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ══ DANCER 8 · 315° top-left · waist (59, 59) ══ -->
  <g transform="translate(59,59)">
    <circle cx="0" cy="-22" r="5" fill="#a8472a"/>
    <path d="M -8,-16 L 8,-16 L 0,0 Z" fill="#a8472a"/>
    <path d="M 0,0 L -7,14 L 7,14 Z" fill="#a8472a"/>
    <line x1="-8" y1="-16" x2="-20" y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8"  y1="-16" x2="20"  y2="-28" stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-7" y1="14"  x2="-11" y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7"  y1="14"  x2="11"  y2="26"  stroke="#a8472a" stroke-width="1.3" stroke-linecap="round"/>
  </g>

</svg>
